syntax = "proto3";

package dexlock;

// A columnar (struct-of-arrays) dump of every monitor-enter lock point found in a
// set of DEX artifacts, each resolved to its canonical lock definition.
//
// The four *_id / line columns are parallel arrays: row i of the dump is
// (class_id[i], method_id[i], lock_id[i], line[i]). Every id indexes into the
// deduplicated `strings` pool, so each repeated class / method / lock name is
// stored exactly once — the whole point of the format is that these names repeat
// heavily, so interning them makes the output a fraction of the JSON form.
message LockPoints {
  repeated string strings   = 1;                 // interned string pool
  repeated uint32 class_id  = 2 [packed = true]; // holder class (may be Outer$Inner)
  repeated uint32 method_id = 3 [packed = true]; // holder method key: class.name:sig
  repeated uint32 lock_id   = 4 [packed = true]; // canonical lock definition
  repeated uint32 line      = 5 [packed = true]; // source line; 0 = unknown
}
