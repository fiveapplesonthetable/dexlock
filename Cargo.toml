[package]
name = "dexlock"
version = "0.1.0"
edition = "2021"
description = "Fast lock-contention resolver: maps monitor-contention source sites to their canonical locks by analyzing DEX bytecode."
license = "Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
log = "0.4"
env_logger = "0.11"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
zip = "2"

[profile.release]
lto = "thin"
codegen-units = 1
